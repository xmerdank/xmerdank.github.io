# Пересборка профиля Throne (xRules/xThrone.json) при каждом изменении списков правил.
# Запуск вручную: вкладка Actions → "Сборка профиля Throne" → Run workflow.
name: Сборка профиля Throne

on:
  push:
    branches: [main]
    paths:
      - "xRules/rules/**"
      - "tools/build_throne.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-throne
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать xThrone.json из списков
        run: python tools/build_throne.py

      - name: Сохранить изменения
        run: |
          if git diff --quiet -- xRules/xThrone.json; then
            echo "Профиль Throne не изменился."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xRules/xThrone.json
          git commit -m "Обновление профиля Throne"
          git pull --rebase
          git push
