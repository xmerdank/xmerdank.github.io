# Еженедельное обновление рекламных списков (reject.list, reject.txt и профиль Throne)
# из StevenBlack/hosts и HaGeZi Multi Light (источники — в tools/build_reject.py, SOURCES).
# Запуск вручную: вкладка Actions → "Обновление списков блокировки" → Run workflow.
name: Обновление списков блокировки

on:
  schedule:
    - cron: "0 3 * * 1"   # каждый понедельник в 03:00 UTC (08:00 по Ашхабаду)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-reject
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Скачать источники и пересобрать списки
        run: python tools/build_reject.py

      # Профиль Throne включает тот же большой список. Коммит бота не запускает
      # workflow "Сборка профиля Throne", поэтому профиль пересобирается прямо здесь.
      - name: Пересобрать профиль Throne
        run: python tools/build_throne.py

      - name: Сохранить изменения
        run: |
          # Строку с датой сборки не считаем изменением — коммит только если поменялись сами домены
          if git diff --quiet -I '^# (Собрано|Доменов):' -- xRocket/rules/reject.list xRocket/rules/reject.txt; then
            echo "Домены не изменились — коммит не нужен."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xRocket/rules/reject.list xRocket/rules/reject.txt xRocket/Throne.json
          git commit -m "Обновление списков блокировки $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
